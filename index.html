<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nozomi | JLPT Study</title>
<script>try{var t=localStorage.getItem('shiori_theme');document.documentElement.dataset.theme=t||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="stylesheet" href="shiori.css">
<script src="data/manifest.js"></script>
<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="sync.js"></script>
<style>
.hero { margin-top: 32px; position: relative; overflow: hidden; padding: 44px 48px; min-height: 330px; background: var(--s-sky); border: none; }
.hero > *:not(.scene):not(.hero-vert) { position: relative; z-index: 2; }
.scene { position: absolute; right: 0; bottom: 0; width: 58%; height: 100%; z-index: 1; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 22%); mask-image: linear-gradient(90deg, transparent 0%, #000 22%); }
.scene .sun { fill: var(--s-sun); opacity: .8; }
.scene .m-far { fill: var(--s-mtn-far); opacity: .55; }
.scene .m-fuji { fill: var(--s-mtn-mid); opacity: .85; }
.scene .snow { fill: var(--s-snow); opacity: .9; }
.scene .m-near { fill: var(--s-mtn-near); opacity: .8; }
.scene .mist { fill: #fff; opacity: .45; }
.scene .wave { fill: none; stroke: #fff; stroke-width: 1.4; opacity: .4; }
.scene .bird { fill: none; stroke: var(--s-ink-soft); stroke-width: 1.4; stroke-linecap: round; opacity: .55; }
:root[data-theme="dark"] .scene .mist { opacity: .06; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .scene .mist { opacity: .06; } }
.hero-vert { position: absolute; top: 34px; right: 36px; z-index: 2; writing-mode: vertical-rl; font: 700 1.05rem var(--s-f-display); letter-spacing: .5em; color: var(--s-ink-soft); opacity: .85; }
.hero-vert::after { content: "望"; display: block; margin-top: 10px; width: 22px; height: 22px; line-height: 20px; text-align: center; letter-spacing: 0; font-size: .75rem; color: var(--s-shu); border: 1.5px solid var(--s-shu); border-radius: 3px; }
.eyebrow { font-size: .8rem; color: var(--s-ink-faint); letter-spacing: .08em; }
.hero h1 { font: 700 2.3rem/1.3 var(--s-f-display); margin: 6px 0 8px; max-width: 520px; }
.hero p { color: var(--s-ink-soft); margin: 0 0 22px; max-width: 460px; }
.cont { display: inline-flex; flex-direction: column; gap: 4px; padding: 14px 18px; border-radius: 16px; background: color-mix(in srgb, var(--s-card) 82%, transparent); border: 1px solid var(--s-line); max-width: 420px; }
.cont small { font-size: .75rem; letter-spacing: .08em; color: var(--s-ink-faint); text-transform: uppercase; }
.cont b { font: 700 1.15rem var(--s-f-display); }
.cont .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

.plan-strip { margin-top: 18px; padding: 16px 22px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; transition: transform .15s ease, box-shadow .15s ease; }
.plan-strip:hover { transform: translateY(-2px); box-shadow: var(--s-shadow-lift); }
.plan-strip .days { font: 800 2.1rem/1 var(--s-f-display); color: var(--s-shu); }
.plan-strip .days small { display: block; font: 500 .72rem var(--s-f-ui); color: var(--s-ink-faint); letter-spacing: .06em; text-align: center; }
.plan-strip .pl { flex: 1; min-width: 200px; display: grid; gap: 3px; }
.plan-strip .pl b { font: 700 1.05rem var(--s-f-display); }
.plan-strip .pl span { font-size: .88rem; color: var(--s-ink-soft); }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.lv { padding: 18px; display: grid; gap: 10px; transition: transform .15s ease, box-shadow .15s ease; }
.lv:hover { transform: translateY(-3px); box-shadow: var(--s-shadow-lift); }
.lv-top { display: flex; align-items: center; gap: 10px; }
.lv-badge { font: 800 1.15rem var(--s-f-display); width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--s-ai-soft); color: var(--s-ai-deep); }
.lv-top div { line-height: 1.25; }
.lv-top b { font: 700 1.05rem var(--s-f-display); display: block; }
.lv-top span { font-size: .78rem; color: var(--s-ink-faint); }
.mini { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 8px; font-size: .74rem; color: var(--s-ink-faint); }
.mini .bar { height: 5px; }
.mini .bar i { background: var(--c); }

.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.duo > div { display: flex; flex-direction: column; }
.duo .panel { flex: 1; }
.kotd { padding: 24px; display: flex; gap: 22px; align-items: center; background: linear-gradient(135deg, var(--s-sakura-soft), var(--s-card) 60%); }
.kotd-k { flex: none; font: 800 5rem/1 var(--s-f-display); width: 124px; height: 124px; display: grid; place-items: center; border-radius: 16px; background: var(--s-card); color: var(--s-shu); box-shadow: var(--s-shadow); }
.kotd .m { font: 700 1.25rem var(--s-f-display); margin: 2px 0 6px; }
.kotd .r { font-size: .95rem; color: var(--s-ai-deep); font-weight: 700; }
.kotd .exw { font-size: .95rem; color: var(--s-ink-soft); margin-top: 6px; }
.kotd .exw b { font: 700 1.15rem var(--s-f-display); color: var(--s-ink); margin-right: 6px; }
.tip { padding: 24px; display: flex; flex-direction: column; justify-content: center; gap: 10px; background: linear-gradient(160deg, var(--s-matcha-soft), var(--s-card) 65%); }
.tip .jp { font: 700 1.5rem var(--s-f-display); color: var(--s-matcha-text); }
.tip p { margin: 0; color: var(--s-ink-soft); font-size: .92rem; }

.today { padding: 22px; display: grid; gap: 16px; align-content: start; }
.today-top { display: flex; gap: 18px; align-items: center; }
.ring.big { width: 96px; height: 96px; }
.ring.big::before { width: 78px; height: 78px; content: ""; }
.ring.big { position: relative; }
.ring.big > span { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-size: .78rem; color: var(--s-ink-faint); line-height: 1.1; }
.ring.big > span b { font: 700 1.5rem var(--s-f-display); color: var(--s-ink); }
.today-info { display: grid; gap: 6px; }
.today-info > b { font-size: 1.05rem; }
.streak-line { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--s-shu-text); font-weight: 700; }
.week { display: flex; gap: 6px; }
.week span { display: grid; justify-items: center; gap: 2px; font-size: .68rem; color: var(--s-ink-faint); }
.week i { width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed var(--s-line); }
.week .met i { border: none; background: var(--s-matcha); box-shadow: inset 0 0 0 5px var(--s-matcha-soft); }
.week .now i { border-color: var(--s-matcha); border-style: solid; }
.today-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.goal-pick { font-size: .85rem; color: var(--s-ink-faint); display: flex; align-items: center; gap: 8px; }
.goal-pick select { font: 700 .9rem var(--s-f-ui); padding: 6px 10px; border-radius: 10px; border: 1px solid var(--s-line); background: var(--s-card); color: var(--s-ink); }
.lvl-line { display: flex; gap: 12px; align-items: center; padding-top: 14px; border-top: 1px dashed var(--s-line); }
.lvl-line > div { flex: 1; display: grid; gap: 5px; }
.lvl-line .bar i { background: var(--s-kin); }
.lvl-badge { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--s-kin); color: var(--s-on); font: 800 1.15rem var(--s-f-display); flex: none; }
@media (max-width: 960px) { .levels { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 820px) {
  .hero { padding: 26px; min-height: 420px; }
  .hero h1 { font-size: 1.8rem; }
  .scene { width: 100%; height: 50%; opacity: .55; -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 50%); mask-image: linear-gradient(180deg, transparent 0%, #000 50%); }
  .hero-vert { display: none; }
  .duo { grid-template-columns: 1fr; }
  .levels { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) { .kotd { flex-direction: column; text-align: center; } }
</style>
</head>
<body>
<div id="top"></div>
<main class="wrap">
  <section class="panel hero">
    <svg class="scene" viewBox="0 0 600 320" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
      <circle class="sun" cx="455" cy="96" r="44"/>
      <path class="bird" d="M300 70 q6 -6 12 0 q6 -6 12 0"/>
      <path class="bird" d="M332 52 q4 -4 8 0 q4 -4 8 0"/>
      <path class="m-far" d="M180 320 L300 205 Q312 194 324 205 L392 262 L470 196 Q480 188 490 196 L600 270 L600 320Z"/>
      <path class="m-fuji" d="M270 320 L428 168 Q450 148 472 168 L600 290 L600 320Z"/>
      <path class="snow" d="M428 168 Q450 148 472 168 L484 180 L470 190 L459 180 L449 192 L439 182 L426 188 L416 180Z"/>
      <rect class="mist" x="230" y="236" width="370" height="10" rx="5"/>
      <rect class="mist" x="300" y="252" width="300" height="6" rx="3"/>
      <path class="m-near" d="M150 320 Q260 262 360 282 T600 268 L600 320Z"/>
      <g class="wave">
        <path d="M200 320 a22 22 0 0 1 44 0 M206 320 a16 16 0 0 1 32 0 M212 320 a10 10 0 0 1 20 0"/>
        <path d="M244 320 a22 22 0 0 1 44 0 M250 320 a16 16 0 0 1 32 0 M256 320 a10 10 0 0 1 20 0"/>
        <path d="M288 320 a22 22 0 0 1 44 0 M294 320 a16 16 0 0 1 32 0 M300 320 a10 10 0 0 1 20 0"/>
        <path d="M332 320 a22 22 0 0 1 44 0 M338 320 a16 16 0 0 1 32 0 M344 320 a10 10 0 0 1 20 0"/>
        <path d="M376 320 a22 22 0 0 1 44 0 M382 320 a16 16 0 0 1 32 0 M388 320 a10 10 0 0 1 20 0"/>
        <path d="M420 320 a22 22 0 0 1 44 0 M426 320 a16 16 0 0 1 32 0 M432 320 a10 10 0 0 1 20 0"/>
        <path d="M464 320 a22 22 0 0 1 44 0 M470 320 a16 16 0 0 1 32 0 M476 320 a10 10 0 0 1 20 0"/>
        <path d="M508 320 a22 22 0 0 1 44 0 M514 320 a16 16 0 0 1 32 0 M520 320 a10 10 0 0 1 20 0"/>
        <path d="M552 320 a22 22 0 0 1 44 0 M558 320 a16 16 0 0 1 32 0 M564 320 a10 10 0 0 1 20 0"/>
      </g>
    </svg>
    <div class="hero-vert">一日一歩</div>
    <div class="eyebrow" id="today">今日</div>
    <h1>おかえり — one small set at a time.</h1>
    <p>Grammar, kanji and vocabulary for every JLPT level, N5 to N1 — in sets small enough to finish today.</p>
    <div class="cont" id="cont"></div>
  </section>

  <a class="panel plan-strip" id="planStrip" href="plan.html"></a>

  <h2 class="section-title">Levels <small>N5 is the easiest, N1 the hardest</small></h2>
  <section class="levels" id="levels"></section>

  <section class="duo">
    <div>
      <h2 class="section-title">今日 <small>Today</small></h2>
      <div class="panel today" id="todayPanel"></div>
    </div>
    <div>
      <h2 class="section-title">今日の漢字 <small>Kanji of the day</small></h2>
      <div class="panel kotd" id="kotd"><div class="muted">Loading…</div></div>
    </div>
  </section>

  <h2 class="section-title" id="stamps">御朱印帳 <small id="stampCount">Stamp book</small></h2>
  <section class="panel stampbook" id="stampbook"></section>
</main>
<div id="foot"></div>

<script>
(function () {
  var S = Shiori, M = SHIORI_MANIFEST;
  S.mount('home');
  var d = new Date();
  document.getElementById('today').textContent = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()] + '曜日 · ' +
    d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

  // continue where you left off
  var last = S.getLast(), cont = document.getElementById('cont');
  if (last && M.counts[last.l] && M.counts[last.l][last.d]) {
    var DK = S.DECKS[last.d], lastSet = Math.min(+last.s || 1, S.setCount(last.l, last.d)), mode = { list: 'List', skim: 'Browse', cards: 'Flashcards', quiz: 'Quiz', compounds: 'Compounds' }[last.m] || 'List';
    cont.innerHTML = '<small>Continue where you left off</small><b>' + last.l.toUpperCase() + ' ' + DK.name + ' · Set ' + lastSet + '</b>' +
      '<div class="acts"><a class="btn btn-primary" href="study.html?l=' + last.l + '&d=' + last.d + '&s=' + lastSet + '&m=' + last.m + '">Continue · ' + mode + ' ' + S.icon(S.ICONS.arrow) + '</a>' +
      '<a class="btn" href="level.html?l=' + last.l + '">' + last.l.toUpperCase() + ' overview</a></div>';
  } else {
    cont.innerHTML = '<small>New here?</small><b>Start with N5 vocabulary · Set 1</b>' +
      '<div class="acts"><a class="btn btn-primary" href="study.html?l=n5&d=vocab&s=1&m=list">Start ' + S.icon(S.ICONS.arrow) + '</a>' +
      '<a class="btn" href="level.html?l=n5">See N5</a></div>';
  }

  // exam countdown + today's plan
  var P = S.examPlan(), strip = document.getElementById('planStrip'), NOUN = { grammar: 'grammar', kanji: 'kanji', vocab: 'words' };
  if (!P.saved) strip.innerHTML = '<div class="pl"><b>試験まで · Taking the JLPT?</b><span>Set your level and exam date to get a day-by-day study plan.</span></div><span class="btn btn-small btn-primary">Make my plan ' + S.icon(S.ICONS.arrow) + '</span>';
  else if (P.daysLeft > 0) {
    var nt = S.nextTask(P);
    strip.innerHTML = '<div class="days">' + P.daysLeft + '<small>DAYS LEFT</small></div><div class="pl"><b>' + P.level.toUpperCase() + ' exam · ' + P.date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) +
      (P.done ? ' · <span class="ahead">today’s plan done ✓</span>' : ' · ≈ ' + Math.max(1, P.minutesLeft) + ' min left today') + '</b><span>Today: ' +
      (P.phase === 'learn' ? P.decks.filter(function (r) { return r.target; }).map(function (r) { return Math.min(r.today, r.target) + '/' + r.target + ' ' + NOUN[r.deck]; }).join(' · ') : 'review phase — no new material') +
      (P.due ? ' · ' + P.due + ' reviews' : '') + '</span></div>' +
      (nt ? '<span class="btn btn-small btn-primary" data-go="' + nt.href + '">' + nt.label + ' ' + S.icon(S.ICONS.arrow) + '</span>' : '') +
      '<span class="btn btn-small">Open plan</span>';
    // the strip is one link to the plan; its Start button jumps straight to the next task
    var go = strip.querySelector('[data-go]');
    if (go) go.addEventListener('click', function (e) { e.preventDefault(); location.href = go.dataset.go; });
  }
  else strip.innerHTML = '<div class="pl"><b>' + (P.daysLeft === 0 ? '試験日 — good luck today!' : 'Your exam date has passed') + '</b><span>Set your next exam to build a new plan.</span></div><span class="btn btn-small">Plan</span>';

  // levels
  document.getElementById('levels').innerHTML = S.LEVELS.map(function (l) {
    var info = S.LEVEL_INFO[l];
    return '<a class="panel lv" href="level.html?l=' + l + '"><div class="lv-top"><div class="lv-badge">' + l.toUpperCase() + '</div>' +
      '<div><b>' + info.jp + '</b><span>' + info.en + '</span></div></div>' +
      S.DECK_ORDER.map(function (dk) {
        var n = M.counts[l][dk], m = n ? S.deckMastered(l, dk) : 0;
        return '<div class="mini d-' + dk + '"><span>' + S.DECKS[dk].name.replace('Vocabulary', 'Vocab') + '</span>' +
          (n ? '<div class="bar" title="' + m + ' / ' + n + ' mastered"><i style="width:' + (m / n * 100) + '%"></i></div>' : '<span>soon</span>') + '</div>';
      }).join('') + '</a>';
  }).join('');


  // today: goal ring, streak, week, due reviews, level
  function renderToday() {
    var g = S.game(), pct = Math.min(100, g.today / g.goal * 100), lp = (g.xp - g.levelStart) / (g.levelEnd - g.levelStart) * 100;
    document.getElementById('todayPanel').innerHTML =
      '<div class="today-top"><div class="ring big" style="--p:' + pct + '" data-label=""><span><b>' + g.today + '</b>/ ' + g.goal + '</span></div>' +
      '<div class="today-info"><b class="jp">' + (g.metToday ? '目標達成 — goal reached' : (g.goal - g.today) + ' cards to today’s goal') + '</b>' +
      '<div class="streak-line">' + S.icon('<path d="M12 3c1 3 4 5 4 9a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 0-8z"/>') + g.streak + '-day streak</div>' +
      '<div class="week">' + g.week.map(function (d) { return '<span class="' + (d.met ? 'met' : '') + (d.today ? ' now' : '') + '" title="' + d.count + ' cards"><i></i>' + d.label + '</span>'; }).join('') + '</div></div></div>' +
      '<div class="today-row">' + (g.due
        ? '<a class="btn btn-primary" href="review.html">' + S.icon('<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/>') + 'Review ' + g.due + ' due</a>'
        : '<span class="muted" style="font-size:.88rem">No reviews due — mastered cards come back on a schedule.</span>') +
      '<label class="goal-pick">Daily goal <select id="goalSel">' + [10, 20, 30, 50, 80].map(function (n) { return '<option' + (n === g.goal ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></label></div>' +
      '<div class="lvl-line"><span class="lvl-badge">' + g.level + '</span><div><b>Level ' + g.level + ' · <span class="jp">' + g.rank.jp + '</span></b> <span class="muted">' + g.rank.en + '</span>' +
      '<div class="bar"><i style="width:' + lp + '%"></i></div><small class="muted">' + (g.xp - g.levelStart) + ' / ' + (g.levelEnd - g.levelStart) + ' points to level ' + (g.level + 1) + '</small></div></div>';
    document.getElementById('goalSel').onchange = function () { S.setting('goal', +this.value); renderToday(); S.mount('home'); };
  }
  renderToday();

  // stamp book
  var got = S.game().stamps, have = S.STAMPS.filter(function (x) { return got[x[0]]; }).length;
  document.getElementById('stampCount').textContent = 'Stamp book · ' + have + ' of ' + S.STAMPS.length + ' collected';
  document.getElementById('stampbook').innerHTML = S.STAMPS.map(function (x) {
    var on = !!got[x[0]];
    return '<div class="stamp' + (on ? '' : ' locked') + '" title="' + S.esc(x[3]) + (on ? ' · earned ' + new Date(got[x[0]]).toLocaleDateString() : '') + '">' +
      '<span class="seal">' + x[1] + '</span><b>' + x[2] + '</b><small>' + x[3] + '</small></div>';
  }).join('');

  // kanji of the day from the level you're studying (N5 by default)
  var lv = last && last.l ? last.l : 'n5';
  S.load(lv, 'kanji', function (items) {
    var box = document.getElementById('kotd');
    if (!items || !items.length) { box.innerHTML = ''; return; }
    var day = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5), i = day % items.length, k = items[i];
    var set = Math.min(Math.floor(i / M.setSize.kanji) + 1, S.setCount(lv, 'kanji')), ex = k.ex && k.ex[0];
    box.innerHTML = '<div class="kotd-k">' + S.esc(k.k) + '</div><div style="flex:1">' +
      '<div class="r">' + S.esc(k.on.concat(k.kun).join('・')) + '</div><div class="m">' + S.esc(k.m) + '</div>' +
      (ex ? '<div class="exw"><b>' + S.esc(ex.w) + '</b>' + S.esc(ex.r) + ' — ' + S.esc(ex.m) + '</div>' : '') +
      '<div style="display:flex;gap:8px;align-items:center;margin-top:12px">' + S.speakBtn(ex ? ex.r : k.on.concat(k.kun).join('、')) +
      '<a class="btn btn-small" href="study.html?l=' + lv + '&d=kanji&s=' + set + '&m=list">' + lv.toUpperCase() + ' kanji · Set ' + set + '</a></div></div>';
  });
})();
</script>
</body>
</html>
